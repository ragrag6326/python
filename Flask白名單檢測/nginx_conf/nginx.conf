
#user  nobody;
#user nginx;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    variables_hash_max_size 4096;
    server_names_hash_bucket_size 2048;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    client_max_body_size 50m;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 120;
    server_tokens off;
    tcp_nodelay on;

    fastcgi_connect_timeout 300;
    fastcgi_send_timeout 300;
    fastcgi_read_timeout 300;
    fastcgi_buffer_size 64k;
    fastcgi_buffers 4 64k;
    fastcgi_busy_buffers_size 128k;
    fastcgi_temp_file_write_size 128k;
    
    #Gzip Compression
    gzip on;
    gzip_buffers 16 8k;
    gzip_comp_level 6;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
    gzip_disable  "msie6";


    #If you have a lot of static files to serve through Nginx then caching of the files' metadata (not the actual files' contents) can save some latency.
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    log_format upstream2 '$proxy_add_x_forwarded_for $remote_user [$time_local] "$request" $http_host'
        '$body_bytes_sent "$http_referer" "$http_user_agent" $ssl_protocol $ssl_cipher'
        '$request_time [$status] [$upstream_status] [$upstream_response_time] "$upstream_addr"';

    log_format main '$remote_addr $server_addr "$host" [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$upstream_addr" "$upstream_status" "$http_user_agent" '
                    '"$http_x_forwarded_for" "$request_body" ';

    log_format log_429 '$remote_addr $server_addr "$host" [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$upstream_addr" "$upstream_status" "$http_user_agent" '
                    '"$http_x_forwarded_for"';

    log_format log_body escape=json '$remote_addr $server_addr "$host" [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$upstream_addr" "$upstream_status" "$http_user_agent" '
                    '"$request_body"  "$http_x_forwarded_for"';

    include       conf.d/*.conf;
    include       conf.d/*/*.conf;

}
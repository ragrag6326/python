upstream merchent_flask_auth {
        server 127.0.0.1:8080;
        server 127.0.0.1:8964 backup;
}


server {
        listen 80;
        server_name  ; 

        access_log  /var/log/nginx/cloudpay_merchent.access.log;
        error_log /var/log/nginx/cloudpay_merchent_error.log;
        client_max_body_size 0;

        # 其他來源就無需驗證
        location / {
                proxy_pass http://192.168.22.6;   # cloudpay ingress 位置
                proxy_set_header Host $host;
                proxy_connect_timeout        150;
                proxy_send_timeout           150;
                proxy_read_timeout           150;
                proxy_buffer_size            128k;
                proxy_buffers                8 128k;
                proxy_busy_buffers_size      128k;
                proxy_temp_file_write_size   128k;
        }
}


# 商戶 提線白名單驗證
server {
        listen 80;
        28k;
        }

        # 2. 商戶 -> 玩家提現(回調版本) 提現的異步通知版本，建單成功先返回對應提現金額，提現結果則發送回調通知
       client_max_body_size 0;

        # 其他來源就無需驗證
        location / {
                proxy_pass http://192.168.22.6;   #  ingress 位置
                proxy_set_header Host $host;
                proxy_connect_timeout        150;
                proxy_send_timeout           150;
                proxy_read_timeout           150;
                proxy_buffer_size            128k;
                proxy_buffers                8 128k;
                proxy_busy_buffers_size      128k;
                proxy_temp_file_write_size   128k;
        }

       
        # 1. 商戶 -> 玩家提現(無回調版本) 玩家提現是商戶調用，會返回對應提現金額
        location = /api/partner/orders {

                if ($request_method != POST) {
                    # 405 錯誤 HTTP狀態碼，表請求的方法不允許
                    return 405;
                }

                auth_request /withdraw/auth;

                proxy_pass http://192.168.22.6;  # cloudpay ingress 位置
                proxy_set_header Host $host;
                proxy_connect_timeout        150;
                proxy_send_timeout           150;
                proxy_read_timeout           150;
                proxy_buffer_size            128k;
                proxy_buffers                8 128k;
                proxy_busy_buffers_size      128k;
                proxy_temp_file_write_size   128k;
        }

        # 2. 商戶 -> 玩家提現(回調版本) 提現的異步通知版本，建單成功先返回對應提現金額，提現結果則發送回調通知
        location = /api/partner/orders-withNotify {

                # 參考對接文檔 方法為POST
                if ($request_method != POST) {
                    # 405 錯誤 HTTP狀態碼，表請求的方法不允許
                    return 405;
                }

                auth_request /withdraw/auth;

                proxy_pass http://192.168.22.6;   # cloudpay ingress 位置
                proxy_set_header Host $host;
                proxy_connect_timeout        150;
                proxy_send_timeout           150;
                proxy_read_timeout           150;
                proxy_buffer_size            128k;
                proxy_buffers                8 128k;
                proxy_busy_buffers_size      128k;
                proxy_temp_file_write_size   128k;
        }

        # 商戶 提線白名單驗證認路徑
        location = /withdraw/auth {

                # 設定為內部使用
                internal;

                proxy_pass http://merchent_flask_auth/withdraw/auth;  # 代理到本地的 Flask 應用

                # 丟棄請求的內容，僅保留標頭資訊
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";

                # 傳遞認證用的標頭資訊（選用請勿拿掉
                proxy_set_header Host $http_host;
                proxy_set_header X-Original-URI $request_uri;
        }

}